<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 — 맥 ZIP 윈도우 변환기</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f4f1;--card:#ffffff;--line:#e3e3dd;--txt:#1c1c1a;--muted:#76766e;--accent:#2f5fa6}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);background:var(--bg);min-height:100vh;padding:0 20px 72px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;display:flex;flex-direction:column}
.wrap{max-width:640px;margin:0 auto;padding-top:80px;text-align:center;flex:1}
.code{font-size:56px;font-weight:700;color:#e0e0d8;margin:0 0 8px;line-height:1}
h1{font-size:20px;font-weight:700;margin:0 0 12px}
p{font-size:14px;color:#4a4a44;margin:0 0 28px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:11px 22px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none}
.btn:hover{background:#26508d}
.links{margin-top:20px;font-size:13px;color:var(--muted)}
.links a{color:var(--muted);margin:0 8px}
.links a:hover{color:var(--txt)}
nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;margin:0 -20px}
.nav-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;height:46px;gap:20px}
.nav-brand{font-weight:700;font-size:14px;color:var(--txt);text-decoration:none;flex:1}
.nav-link{font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.nav-link:hover,.nav-brand:hover{color:var(--accent)}
footer{text-align:center;padding-bottom:20px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--txt)}
.footer-links{margin-top:6px}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="/">맥 ZIP 윈도우 변환기</a>
    <a class="nav-link" href="/about.html">소개</a>
    <a class="nav-link" href="/contact.html">문의</a>
    <a class="nav-link" href="/privacy.html">개인정보처리방침</a>
  </div>
</nav>
<main class="wrap">
  <p class="code">404</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>요청하신 페이지가 존재하지 않거나 이동되었을 수 있습니다.</p>
  <a class="btn" href="/">홈으로 돌아가기</a>
  <div class="links">
    <a href="/about.html">소개</a>
    <a href="/contact.html">문의</a>
    <a href="/privacy.html">개인정보처리방침</a>
  </div>
</main>
<footer>
  <p>© 2026 맥 ZIP 윈도우 변환기</p>
  <p class="footer-links"><a href="/about.html">소개</a> · <a href="/contact.html">문의</a> · <a href="/privacy.html">개인정보처리방침</a></p>
</footer>
</body>
</html>
